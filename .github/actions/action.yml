name: Build Timer
description: Set up Python, validate the source, and build the standalone Timer executable.
author: liuxf

inputs:
  python-version:
    description: Python version used to build the application.
    required: false
    default: "3.11"
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        python -m pip install PyQt6 psutil requests pynput pyinstaller

    - name: Validate Python sources
      shell: pwsh
      run: |
        python -m compileall -q app.py update.py ui lib data

    - name: Build standalone executable
      shell: pwsh
      run: |
        $appInfo = Get-Content data\appInfo.py -Raw
        $appName = [regex]::Match($appInfo, 'app_name\s*=\s*"([^"]+)"').Groups[1].Value
        if ([string]::IsNullOrWhiteSpace($appName)) {
          throw "Unable to read app_name from data\appInfo.py"
        }

        $outputDir = Join-Path $env:GITHUB_WORKSPACE ".release_build"
        New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
        $pyinstallerArgs = @(
          "--clean",
          "--noconfirm",
          "--onefile",
          "--windowed",
          "--name", $appName,
          "--icon", (Join-Path $env:GITHUB_WORKSPACE "sources\timer.ico"),
          "--add-data", "$(Join-Path $env:GITHUB_WORKSPACE 'sources');sources",
          "--add-data", "$(Join-Path $env:GITHUB_WORKSPACE 'plugins');plugins",
          "--distpath", $outputDir,
          (Join-Path $env:GITHUB_WORKSPACE "app.py")
        )
        & python -m PyInstaller @pyinstallerArgs
        if ($LASTEXITCODE -ne 0) {
          throw "PyInstaller failed with exit code $LASTEXITCODE"
        }

        $exePath = Join-Path $outputDir "$appName.exe"
        if (-not (Test-Path $exePath)) {
          Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter *.exe |
            Select-Object -ExpandProperty FullName
          throw "PyInstaller completed without creating $exePath"
        }
