name: Build Timer
description: Set up Python, validate the source, and build the standalone Timer executable.
author: liuxf

inputs:
  python-version:
    description: Python version used to build the application.
    required: false
    default: "3.11"
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        python -m pip install PyQt6 psutil requests pynput pyinstaller

    - name: Validate Python sources
      shell: pwsh
      run: |
        python -m compileall -q app.py update.py ui lib data

    - name: Build standalone executable
      shell: pwsh
      run: |
        $appInfo = Get-Content data\appInfo.py -Raw
        $appName = [regex]::Match($appInfo, 'app_name\s*=\s*"([^"]+)"').Groups[1].Value
        if ([string]::IsNullOrWhiteSpace($appName)) {
          throw "Unable to read app_name from data\appInfo.py"
        }

        python -m PyInstaller `
          --clean `
          --noconfirm `
          --onefile `
          --windowed `
          --name $appName `
          --icon sources\timer.ico `
          --add-data "sources;sources" `
          --add-data "plugins;plugins" `
          --distpath .release_build `
          app.py
