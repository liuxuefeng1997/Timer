name: Timer CI

on:
  push:
    branches:
      - origin
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build Timer
        uses: ./.github/actions

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: timer-executable
          path: ${{ github.workspace }}/dist/*.exe
          if-no-files-found: error

      - name: Read application version
        if: github.event_name != 'pull_request'
        id: app_info
        shell: pwsh
        run: |
          $appInfo = Get-Content data\appInfo.py -Raw
          $appName = [regex]::Match($appInfo, 'app_name\s*=\s*"([^"]+)"').Groups[1].Value
          $version = [regex]::Match($appInfo, 'ver\s*=\s*"([^"]+)"').Groups[1].Value

          if ([string]::IsNullOrWhiteSpace($appName) -or [string]::IsNullOrWhiteSpace($version)) {
            throw "Unable to read app_name or ver from data\appInfo.py"
          }

          "app_name=$appName" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create version tag
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.app_info.outputs.version }}"
          gh api "repos/${{ github.repository }}/git/refs" `
            --method POST `
            -f "ref=refs/tags/$tag" `
            -f "sha=${{ github.sha }}" *> $null

          if ($LASTEXITCODE -eq 0) {
            Write-Host "Created tag $tag"
          } else {
            gh api "repos/${{ github.repository }}/git/ref/tags/$tag" *> $null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Tag $tag already exists; keeping the existing tag"
            } else {
              throw "Failed to create or find tag $tag"
            }
          }

      - name: Check whether release already exists
        if: github.event_name != 'pull_request'
        id: release_check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.app_info.outputs.version }}" --repo "${{ github.repository }}" *> $null
          $ghExitCode = $LASTEXITCODE
          if ($ghExitCode -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
          } elseif ($ghExitCode -eq 1) {
            "exists=false" >> $env:GITHUB_OUTPUT
          } else {
            throw "Failed to check whether release '${{ steps.app_info.outputs.version }}' exists"
          }
          exit 0

      - name: Create release archive
        if: github.event_name != 'pull_request' && steps.release_check.outputs.exists != 'true'
        id: package
        shell: pwsh
        run: |
          $appName = "${{ steps.app_info.outputs.app_name }}"
          $version = "${{ steps.app_info.outputs.version }}"

          $archiveName = "${appName}_${version}.zip"
          $staging = Join-Path $env:RUNNER_TEMP "timer-release"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          $exePath = Join-Path $env:GITHUB_WORKSPACE "dist\${appName}.exe"
          if (-not (Test-Path $exePath)) {
            throw "Executable not found: $exePath"
          }
          Copy-Item $exePath "$staging\${appName}.exe"
          Copy-Item "README.md" "$staging\README.md"
          $archivePath = Join-Path $env:GITHUB_WORKSPACE "$archiveName"
          Compress-Archive -Path "$staging\*" -DestinationPath $archivePath -Force

          $commitMessage = (git log -1 --pretty=%B | Out-String).TrimEnd("`r", "`n")
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          $releaseNotes = "## 更新日志：`r`n`r`n$commitMessage`r`n"
          [System.IO.File]::WriteAllText(
            $notesPath,
            $releaseNotes,
            [System.Text.UTF8Encoding]::new($false)
          )

          "archive=$archivePath" >> $env:GITHUB_OUTPUT
          "tag=$version" >> $env:GITHUB_OUTPUT
          "name=$appName $version" >> $env:GITHUB_OUTPUT
          "notes=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Upload release archive
        if: github.event_name != 'pull_request' && steps.release_check.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: timer-release
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name != 'pull_request' && steps.release_check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: ${{ steps.package.outputs.name }}
          files: ${{ steps.package.outputs.archive }}
          body_path: ${{ steps.package.outputs.notes }}
          generate_release_notes: false
          make_latest: true
